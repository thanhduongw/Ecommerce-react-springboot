<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Layered Architecture - E-commerce</title>
    <style>
        :root {
            --font: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #ffffff;
            color: #000000;
            font-family: var(--font);
        }

        .diagram-wrapper {
            padding: 16px;
            overflow-x: auto;
        }

        .diagram {
            min-width: 1700px;
            display: block;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #666666;
            font-weight: 600;
            margin: 6px 0 16px;
        }

        svg text {
            font-family: var(--font);
        }

        .layer-title {
            font-size: 14px;
            font-weight: 600;
            fill: #000000;
        }

        .box-text {
            font-size: 12px;
            fill: #000000;
        }

        .box-text-white {
            font-size: 12px;
            fill: #ffffff;
        }

        .legend-text {
            font-size: 11px;
            fill: #000000;
        }

        .label-text {
            font-size: 11px;
            fill: #000000;
        }
    </style>
</head>

            <!-- Legend Panel -->

            <text x="1096" y="36" class="legend-text">
                <tspan x="1096" dy="0">Domain Layer (chỉ chứa business rule) - nơi chứa logic</tspan>
                <tspan x="1096" dy="14">nghiệp vụ cốt lõi của hệ thống: Tạo đơn hàng,</tspan>
                <tspan x="1096" dy="14">Kiểm tra tồn kho, Thanh toán, Tính giá, Áp dụng</tspan>
                <tspan x="1096" dy="14">giảm giá... và những logic này không phụ thuộc:</tspan>
                <tspan x="1096" dy="14">database, RabbitMQ, Redis, framework,...</tspan>
                <tspan x="1096" dy="18">Entities - đối tượng có định danh (ID): User, Product,</tspan>
                <tspan x="1096" dy="14">ProductItem, Category, Payment, Address, RedisToken</tspan>
                <tspan x="1096" dy="18">Aggregates - nhóm entity được quản lý bởi 1 root:</tspan>
                <tspan x="1096" dy="14">OrderAggregate: Order, OrderItem; CartAggregate: Cart,</tspan>
                <tspan x="1096" dy="14">CartItem</tspan>
                <tspan x="1096" dy="18">Value Objects - là object không có ID: Money, Address,</tspan>
                <tspan x="1096" dy="14">OrderItem, CartItem</tspan>
                <tspan x="1096" dy="18">Domain Events - sự kiện nghiệp vụ xảy ra trong hệ thống:</tspan>
                <tspan x="1096" dy="14">OrderCreated, InventoryChecked, PaymentSucceeded,</tspan>
                <tspan x="1096" dy="14">PaymentFailed, OrderConfirmed, OrderCancelled,</tspan>
